<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drapely – Fashion Store</title>
<style>
:root{--ink:#282c3f;--mute:#7e818c;--line:#eaeaec;--bg:#fff;--soft:#f5f5f6;--accent:#e8336d;--ok:#03a685;--warn:#ff905a}
@media(prefers-color-scheme:dark){:root{--ink:#eceef5;--mute:#9a9eb0;--line:#33364a;--bg:#171925;--soft:#20233a}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;width:100%}
header.main{position:sticky;top:0;z-index:20;background:var(--bg);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.top{display:flex;align-items:center;gap:20px;padding:12px 4vw;flex-wrap:wrap}
.logo{font-weight:800;font-size:24px;color:var(--accent);letter-spacing:-.5px}
nav{display:flex;gap:22px;font-weight:600;font-size:14px;flex:1}
nav a{padding:8px 0;border-bottom:3px solid transparent;cursor:pointer}
nav a:hover,nav a.on{border-color:var(--accent)}
.search{flex:0 1 380px;display:flex;align-items:center;background:var(--soft);border-radius:4px;padding:0 12px}
.search input{border:0;background:none;outline:0}
.icons{display:flex;gap:18px;font-size:12px;font-weight:600}
.icons button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.badge{position:absolute;top:-6px;right:-8px;background:var(--accent);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px;font-style:normal}
.badge:empty{display:none}
/* address bar */
.addr{display:flex;align-items:center;gap:10px;padding:8px 4vw;background:var(--soft);font-size:13px;flex-wrap:wrap}
.addr b{font-weight:700}
.addr .chg{color:var(--accent);font-weight:700;margin-left:auto}
.hero{position:relative;overflow:hidden;height:300px}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 8vw;color:#fff;opacity:0;transition:opacity .6s}
.slide.on{opacity:1}
.slide h1{font-size:clamp(28px,5vw,54px);line-height:1.05;max-width:12ch}
.slide p{margin:12px 0 20px;font-size:18px}
.slide .cta{align-self:flex-start;background:#fff;color:#282c3f;padding:12px 26px;font-weight:700;border-radius:3px}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer}
.dots i.on{background:#fff}
section{padding:30px 4vw 6px}
h2{font-size:19px;letter-spacing:1px;margin-bottom:16px;font-weight:700;text-transform:uppercase}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.cat{aspect-ratio:1;border-radius:6px;display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:700;cursor:pointer;background-size:cover;background-position:center;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.shop{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:0 4vw 50px}
aside.flt{border-right:1px solid var(--line);padding-right:18px;font-size:14px;align-self:start;position:sticky;top:120px}
aside.flt h4{margin:14px 0 8px;font-size:13px;letter-spacing:.8px;text-transform:uppercase}
aside.flt label{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
aside.flt input{width:auto;accent-color:var(--accent)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:14px;gap:10px;flex-wrap:wrap}
.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px 14px}
.card{position:relative;border-radius:4px;overflow:hidden;cursor:pointer}
.card:hover{box-shadow:0 2px 16px rgba(0,0,0,.18)}
.img{aspect-ratio:3/4;position:relative;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.rate{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.93);color:#282c3f;padding:2px 7px;border-radius:3px;font-size:12px;font-weight:700}
.wish{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);color:#282c3f;font-size:16px}
.wish.on{color:var(--accent)}
.info{padding:10px 8px 12px;font-size:14px}
.info b{display:block}
.info span{color:var(--mute);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{margin-top:5px}
.price b{display:inline!important}
.price s{color:var(--mute);font-size:12px;margin:0 6px}
.price em{font-style:normal;color:var(--warn);font-size:12px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:50px 0}
/* product page */
#pdp{position:fixed;inset:0;z-index:28;background:var(--bg);overflow:auto;display:none}
#pdp.on{display:block}
.pbar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 4vw;display:flex;gap:14px;align-items:center;z-index:2}
.pbar .logo{margin-left:auto}
.pwrap{max-width:1150px;margin:0 auto;padding:20px 4vw 60px;display:grid;grid-template-columns:1.1fr 1fr;gap:34px}
.gal{display:grid;grid-template-columns:70px 1fr;gap:10px;align-self:start}
.thumbs{display:flex;flex-direction:column;gap:8px}
.thumbs img{width:70px;aspect-ratio:3/4;object-fit:cover;border:2px solid transparent;border-radius:3px;cursor:pointer;background:var(--soft)}
.thumbs img.on{border-color:var(--accent)}
.big{aspect-ratio:3/4;background:var(--soft);border-radius:4px;overflow:hidden}
.big img{width:100%;height:100%;object-fit:cover}
.pi h1{font-size:22px}
.pi .sub{color:var(--mute);font-size:18px;margin:2px 0 12px}
.rbadge{display:inline-flex;gap:6px;border:1px solid var(--line);padding:4px 10px;border-radius:3px;font-weight:700;font-size:14px}
.rbadge span{color:var(--mute);font-weight:400}
.pp{font-size:24px;font-weight:800;margin:14px 0 2px;border-top:1px solid var(--line);padding-top:14px}
.pp s{font-size:18px;font-weight:400;color:var(--mute);margin:0 8px}
.pp em{font-style:normal;color:var(--warn);font-size:18px;font-weight:600}
.tax{color:var(--ok);font-size:13px;font-weight:600}
.sizes{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
.sizes button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);font-weight:700}
.sizes button.on{border-color:var(--accent);color:var(--accent)}
.btns{display:flex;gap:12px;margin:6px 0 20px}
.btns button{flex:1;padding:15px;font-weight:700;border-radius:3px;border:1px solid var(--line)}
.btns .pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.box{border-top:1px solid var(--line);padding:16px 0;font-size:14px;line-height:1.6}
.box h3{font-size:15px;margin-bottom:8px}
.pin{display:flex;gap:8px;max-width:300px}
.pin button{color:var(--accent);font-weight:700;white-space:nowrap}
.rev{padding:16px 0;border-bottom:1px solid var(--line);font-size:14px}
.rev .h{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.star{background:var(--ok);color:#fff;padding:1px 7px;border-radius:3px;font-weight:700;font-size:12px}
.star.lo{background:var(--warn)}
.ver{color:var(--mute);font-size:12px}
.dist{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px;max-width:360px;margin:10px 0}
.dist i{display:block;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.dist i u{display:block;height:100%;background:var(--ok)}
.rf{display:grid;gap:8px;max-width:420px;margin-top:12px}
.rf .sel{display:flex;gap:6px}
.rf .sel button{font-size:22px;color:var(--line)}
.rf .sel button.on{color:#f5a623}
.rf .go{background:var(--ink);color:var(--bg);padding:10px;border-radius:3px;font-weight:700}
/* drawer & modal */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;z-index:30}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--bg);z-index:31;transform:translateX(100%);transition:.3s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{border-bottom:1px solid var(--line);padding:16px;display:flex;justify-content:space-between;font-weight:700}
.lines{flex:1;overflow:auto;padding:10px 16px}
.line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.line img{width:60px;height:80px;object-fit:cover;border-radius:3px;flex:none;background:var(--soft)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:3px;margin-top:6px}
.qty button{width:26px;height:26px}
.qty span{width:26px;text-align:center}
.foot{padding:16px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px}
.row.tot{font-weight:800;font-size:16px}
.place{width:100%;background:var(--accent);color:#fff;padding:14px;font-weight:700;border-radius:3px;margin-top:6px}
.dlv{background:var(--soft);padding:10px;border-radius:4px;font-size:13px;margin-bottom:12px}
.mod{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,94vw);max-height:88vh;overflow:auto;background:var(--bg);border-radius:8px;z-index:36;display:none;padding:20px}
.mod.on{display:block}
.mveil{z-index:35}
.ac{border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px;font-size:14px;display:flex;gap:10px;line-height:1.5}
.ac.sel{border-color:var(--accent)}
.ac input{width:auto;accent-color:var(--accent)}
.ac small{color:var(--mute)}
.ac .acts button{color:var(--accent);font-weight:700;font-size:13px;margin-right:12px}
.tag{font-size:11px;border:1px solid var(--line);padding:1px 6px;border-radius:3px;margin-left:6px}
.af{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.af .w{grid-column:1/-1}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,90px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:4px;transition:.3s;z-index:50;font-size:14px;max-width:90vw}
.toast.on{transform:translate(-50%,0)}
footer{background:var(--soft);padding:34px 4vw;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px;font-size:13px;color:var(--mute)}
footer b{display:block;color:var(--ink);margin-bottom:8px}
footer a{display:block;padding:3px 0}
.fbtn{display:none;border:1px solid var(--line);padding:8px 12px;border-radius:4px}
@media(max-width:760px){nav{order:3;width:100%;overflow:auto;flex:none}.shop{grid-template-columns:1fr}aside.flt{position:static;border:0;padding:0;display:none}aside.flt.open{display:block}.fbtn{display:inline-block}.hero{height:240px}.pwrap{grid-template-columns:1fr}.gal{grid-template-columns:1fr}.thumbs{flex-direction:row;order:2}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<header class="main">
  <div class="top">
    <a class="logo" href="#" onclick="closePdp()">Drapely</a>
    <nav id="nav">
      <a data-g="All" class="on">All</a><a data-g="Men">Men</a><a data-g="Women">Women</a><a data-g="Kids">Kids</a><a data-g="Home">Home</a><a data-g="Beauty">Beauty</a>
    </nav>
    <div class="search"><span>🔍</span><input id="q" placeholder="Search for products, brands and more" aria-label="Search"></div>
    <div class="icons">
      <button id="prof">👤<span>Addresses</span></button>
      <button id="wl">♡<span>Wishlist</span><i class="badge" id="wn"></i></button>
      <button id="bag">🛍<span>Bag</span><i class="badge" id="bn"></i></button>
    </div>
  </div>
  <div class="addr" id="addrbar"></div>
</header>

<div class="hero" id="hero"></div>
<section><h2>Shop by category</h2><div class="cats" id="cats"></div></section>
<section id="shop"><h2>Explore products</h2></section>
<div class="shop">
  <aside class="flt" id="filters">
    <h4>Brand</h4><div id="fb"></div>
    <h4>Price</h4>
    <label><input type="radio" name="p" value="0" checked> All prices</label>
    <label><input type="radio" name="p" value="1"> Under ₹1000</label>
    <label><input type="radio" name="p" value="2"> ₹1000 – ₹2500</label>
    <label><input type="radio" name="p" value="3"> Above ₹2500</label>
    <h4>Discount</h4>
    <label><input type="checkbox" id="d40"> 40% and above</label>
  </aside>
  <main>
    <div class="bar">
      <button class="fbtn" id="fbtn">Filters</button><span id="count"></span>
      <label>Sort by <select id="sort">
        <option value="rec">Recommended</option><option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option><option value="disc">Better Discount</option>
        <option value="rate">Customer Rating</option></select></label>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>
<footer>
  <div><b>Online shopping</b><a>Men</a><a>Women</a><a>Kids</a><a>Home</a></div>
  <div><b>Customer policies</b><a>Contact us</a><a>FAQ</a><a>Returns</a><a>Shipping</a></div>
  <div><b>Keep in touch</b><a>Instagram</a><a>YouTube</a><a>X</a></div>
  <div><b>Easy returns</b>14-day returns on every order.</div>
</footer>

<!-- product page -->
<div id="pdp"></div>

<!-- bag/wishlist drawer -->
<div class="veil" id="veil"></div>
<div class="drawer" id="drawer" role="dialog" aria-label="Shopping bag">
  <div class="dh"><span id="dtitle">Bag</span><button id="close" aria-label="Close">✕</button></div>
  <div class="lines" id="lines"></div><div class="foot" id="foot"></div>
</div>

<!-- address modal -->
<div class="veil mveil" id="mveil"></div>
<div class="mod" id="mod" role="dialog" aria-label="Saved addresses"></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const inr=n=>'₹'+n.toLocaleString('en-IN');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- storage (safe) ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- catalogue ---------- */
const brands=['Roadster','Nuvo','Hera & Co','Kinfolk','Stride','Loom','Aurora','Petal'];
const groups=['Men','Women','Kids','Home','Beauty'];
// [name, image keywords]
const items={
 Men:[['Slim Fit Shirt','shirt,man,fashion'],['Cotton Chinos','trousers,man'],['Running Shoes','sneakers,shoes'],['Hooded Sweatshirt','hoodie'],['Leather Belt','belt,leather'],['Polo T-shirt','polo,tshirt']],
 Women:[['Floral Kurta Set','kurta,woman'],['Anarkali Dress','dress,woman,fashion'],['Block Heels','heels,shoes'],['Denim Jacket','denim,jacket'],['Silk Saree','saree'],['Tote Bag','handbag']],
 Kids:[['Graphic Tee','kids,tshirt'],['Dungarees','toddler,clothes'],['Light-up Sneakers','kids,shoes'],['Party Frock','girl,dress'],['Kids Hoodie','child,hoodie'],['School Backpack','backpack']],
 Home:[['Cotton Bedsheet','bedroom,bed'],['Ceramic Vase','vase,flowers'],['Throw Pillow','cushion,sofa'],['Wall Clock','wall,clock'],['Table Lamp','lamp,interior'],['Curtain Pair','curtains,window']],
 Beauty:[['Face Serum','skincare,serum'],['Matte Lipstick','lipstick'],['Perfume 50ml','perfume,bottle'],['Hair Oil','hair,oil'],['Sunscreen SPF50','sunscreen'],['Kajal Pencil','eye,makeup']]};
const hues={Men:210,Women:330,Kids:40,Home:160,Beauty:280};
let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
const P=[];let pid=1;
groups.forEach(g=>items[g].forEach(([n,kw])=>{for(let k=0;k<2;k++){
 const mrp=Math.round((600+rnd()*3800)/10)*10,d=Math.round(15+rnd()*60);
 P.push({id:pid,g,name:n,kw,brand:brands[Math.floor(rnd()*brands.length)],mrp,d,price:Math.round(mrp*(100-d)/100),
  rate:+(3.6+rnd()*1.4).toFixed(1),cnt:Math.round(80+rnd()*4900),h:(hues[g]+Math.floor(rnd()*40))%360});pid++;}}));
// images from the web (loremflickr serves keyword-matched, openly licensed Flickr photos)
const imgUrl=(p,k=0,w=480,h=640)=>`https://loremflickr.com/${w}/${h}/${p.kw}?lock=${p.id*10+k}`;
const grad=p=>`linear-gradient(145deg,hsl(${p.h} 65% 55%),hsl(${(p.h+40)%360} 60% 38%))`;
const icons={Men:'👔',Women:'👗',Kids:'🧸',Home:'🛋️',Beauty:'💄'};
const art=p=>{const a=`hsl(${p.h} 65% 55%)`,b=`hsl(${(p.h+40)%360} 60% 38%)`;
 return'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="300" height="400" fill="url(#g)"/><text x="150" y="190" font-size="110" text-anchor="middle">${icons[p.g]}</text><text x="150" y="290" font-size="22" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="700">${esc(p.brand)}</text><text x="150" y="320" font-size="16" fill="#fff" fill-opacity=".85" text-anchor="middle" font-family="sans-serif">${esc(p.name)}</text></svg>`)};
// stage 0: loremflickr (keyword photo) -> stage 1: picsum photo -> stage 2: drawn illustration (always works offline)
function fb(el){const p=P.find(x=>x.id===+el.dataset.p),st=+(el.dataset.s||0);
 if(st===0){el.dataset.s=1;el.src=`https://picsum.photos/seed/${p.id*10+(+el.dataset.k)}/${el.dataset.w}/${el.dataset.h}`}
 else if(st===1){el.dataset.s=2;el.src=art(p)}}
const im=(p,k,w,h,alt)=>`<img loading="lazy" src="${imgUrl(p,k,w,h)}" data-p="${p.id}" data-k="${k}" data-w="${w}" data-h="${h}" alt="${esc(alt||p.brand+' '+p.name)}" onerror="fb(this)">`;
const imgTag=(p,k,w,h)=>im(p,k,w,h);
const sizesFor=p=>p.g==='Home'||p.g==='Beauty'?[]:/Shoes|Sneakers|Heels/.test(p.name)?['6','7','8','9','10']:['S','M','L','XL','XXL'];

/* ---------- reviews ---------- */
const rn=['Aarav S.','Meera K.','Rohan D.','Sneha P.','Imran A.','Priya N.','Vikram R.','Ananya B.','Karan M.','Divya L.'];
const good=['Great quality for the price','Looks just like the photos','Perfect fit, very comfortable','Worth every rupee','Loved it, will buy again','Fabric feels premium'];
const okay=['Decent, nothing special','Good but delivery was slow','Colour slightly different in person','Fits a bit snug, order one size up'];
const bodyG=['Bought this for a family event and got many compliments. Stitching and finish are clean, and it has held up well after two washes.','Arrived two days early and well packed. The material is better than I expected at this price.','Exactly what I wanted. Size chart was accurate, so it fit right out of the box.','Bought one for myself and a second as a gift. Both people were happy.'];
const bodyO=['Product is fine overall. The colour looked a little brighter online, but it is still nice.','Quality is okay for the price. Packaging could be better, and the return process was smooth.'];
const userRev={};
function reviewsFor(p){
 if(p.rv)return p.rv;
 let s=p.id*13;const r=()=>(s=(s*9301+49297)%233280)/233280;
 p.rv=Array.from({length:7},(_,i)=>{const lo=r()<(5-p.rate)/2.2;const st=lo?(r()<.5?3:2):(r()<.55?5:4);
  return{n:rn[Math.floor(r()*rn.length)],st,t:lo?okay[Math.floor(r()*okay.length)]:good[Math.floor(r()*good.length)],
   b:lo?bodyO[Math.floor(r()*bodyO.length)]:bodyG[Math.floor(r()*bodyG.length)],d:`${1+Math.floor(r()*27)} ${['Oct','Nov','Sep','Aug'][Math.floor(r()*4)]} 2026`,v:true}});
 return p.rv}
const allRev=p=>[...(userRev[p.id]||[]),...reviewsFor(p)];

/* ---------- state ---------- */
const S={g:'All',q:'',brands:new Set(),price:0,d40:false,sort:'rec',
 wish:new Set(store.get('wish',[])),cart:store.get('cart',{}),
 addrs:store.get('addrs',[
  {id:1,name:'Aarav Sharma',phone:'9876543210',pin:'560001',line:'12, MG Road, Near Trinity Circle',city:'Bengaluru',type:'Home'},
  {id:2,name:'Aarav Sharma',phone:'9876543210',pin:'400051',line:'Tower B, 5th Floor, BKC',city:'Mumbai',type:'Work'}]),
 sel:store.get('sel',1)};
const save=()=>{store.set('wish',[...S.wish]);store.set('cart',S.cart);store.set('addrs',S.addrs);store.set('sel',S.sel)};
const curAddr=()=>S.addrs.find(a=>a.id===S.sel);
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- hero & categories ---------- */
const slides=[['End of Season Sale','Up to 70% off on top brands','linear-gradient(120deg,#e8336d,#ff905a)'],
 ['New in: Winter Edit','Jackets, hoodies & knits','linear-gradient(120deg,#2d3a8c,#6a5cf0)'],
 ['Festive Ethnic','Kurtas, sarees & more from ₹499','linear-gradient(120deg,#0f9b8e,#f2b64d)']];
let cur=0;
$('#hero').innerHTML=slides.map((s,i)=>`<div class="slide ${i?'':'on'}" style="background:${s[2]}"><h1>${s[0]}</h1><p>${s[1]}</p><a class="cta" href="#shop">Shop now</a></div>`).join('')+`<div class="dots">${slides.map((_,i)=>`<i class="${i?'':'on'}" data-i="${i}"></i>`).join('')}</div>`;
function go(i){cur=i;document.querySelectorAll('.slide').forEach((e,j)=>e.classList.toggle('on',j===i));document.querySelectorAll('.dots i').forEach((e,j)=>e.classList.toggle('on',j===i))}
$('.dots').onclick=e=>e.target.dataset.i&&go(+e.target.dataset.i);
setInterval(()=>go((cur+1)%slides.length),5000);
$('#cats').innerHTML=groups.map(g=>{const p=P.find(x=>x.g===g);return`<div class="cat" data-g="${g}" style="background-image:linear-gradient(transparent 40%,rgba(0,0,0,.55)),url('${imgUrl(p,5,300,300)}'),${grad(p)}">${g}</div>`}).join('');
$('#cats').onclick=e=>{const g=e.target.dataset.g;if(g){setGroup(g);location.hash='shop'}};
function setGroup(g){S.g=g;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.g===g));closePdp();render()}
$('#nav').onclick=e=>e.target.dataset.g&&setGroup(e.target.dataset.g);

/* ---------- filters / list ---------- */
$('#fb').innerHTML=brands.map(b=>`<label><input type="checkbox" value="${esc(b)}"> ${esc(b)}</label>`).join('');
$('#fb').onchange=e=>{e.target.checked?S.brands.add(e.target.value):S.brands.delete(e.target.value);render()};
document.querySelectorAll('input[name=p]').forEach(r=>r.onchange=()=>{S.price=+r.value;render()});
$('#d40').onchange=e=>{S.d40=e.target.checked;render()};
$('#sort').onchange=e=>{S.sort=e.target.value;render()};
$('#q').oninput=e=>{S.q=e.target.value.toLowerCase();closePdp();render()};
$('#fbtn').onclick=()=>$('#filters').classList.toggle('open');
function list(){
 const r=P.filter(p=>(S.g==='All'||p.g===S.g)&&(!S.brands.size||S.brands.has(p.brand))&&(!S.q||(p.name+p.brand+p.g).toLowerCase().includes(S.q))&&(!S.d40||p.d>=40)&&
  (S.price===0||(S.price===1&&p.price<1000)||(S.price===2&&p.price>=1000&&p.price<=2500)||(S.price===3&&p.price>2500)));
 const f={low:(a,b)=>a.price-b.price,high:(a,b)=>b.price-a.price,disc:(a,b)=>b.d-a.d,rate:(a,b)=>b.rate-a.rate}[S.sort];
 return f?r.sort(f):r}
function render(){
 const r=list();$('#count').textContent=r.length+' items';
 $('#grid').innerHTML=r.length?r.map(p=>`<div class="card" data-open="${p.id}">
  <div class="img" style="background:${grad(p)}">${imgTag(p,0)}<span class="rate">★ ${p.rate} | ${p.cnt>999?(p.cnt/1000).toFixed(1)+'k':p.cnt}</span>
  <button class="wish ${S.wish.has(p.id)?'on':''}" data-w="${p.id}" aria-label="Wishlist">${S.wish.has(p.id)?'♥':'♡'}</button></div>
  <div class="info"><b>${esc(p.brand)}</b><span>${esc(p.name)}</span>
  <div class="price"><b>${inr(p.price)}</b><s>${inr(p.mrp)}</s><em>(${p.d}% OFF)</em></div></div></div>`).join(''):'<div class="empty">No products match your filters. Clear a filter or change your search.</div>';
 const n=Object.values(S.cart).reduce((a,b)=>a+b.q,0);
 $('#wn').textContent=S.wish.size||'';$('#bn').textContent=n||'';save();renderAddr()}
$('#grid').onclick=e=>{const w=e.target.closest('[data-w]');
 if(w){e.stopPropagation();toggleWish(+w.dataset.w);return}
 const c=e.target.closest('[data-open]');if(c)openPdp(+c.dataset.open)};
function toggleWish(i){S.wish.has(i)?S.wish.delete(i):S.wish.add(i);render();if($('#pdp').classList.contains('on'))openPdp(curP.id,true)}

/* ---------- cart ---------- */
function addCart(id,size){const key=id+'|'+(size||'-');const c=S.cart[key];S.cart[key]={id,size,q:(c?c.q:0)+1};render()}

/* ---------- address bar & saved addresses ---------- */
function renderAddr(){const a=curAddr();
 $('#addrbar').innerHTML=a?`<span>📍 Deliver to <b>${esc(a.name)}, ${esc(a.pin)}</b> <span class="tag">${esc(a.type)}</span> — ${esc(a.line)}, ${esc(a.city)}</span><button class="chg" id="chg">Change</button>`
  :`<span>📍 No delivery address selected</span><button class="chg" id="chg">Add address</button>`;
 $('#chg').onclick=openAddr}
let editing=null,showForm=false;
function openAddr(){showForm=false;editing=null;drawAddr();$('#mod').classList.add('on');$('#mveil').classList.add('on')}
function closeAddr(){$('#mod').classList.remove('on');$('#mveil').classList.remove('on')}
function drawAddr(){
 const e=editing||{name:'',phone:'',pin:'',line:'',city:'',type:'Home'};
 $('#mod').innerHTML=`<div class="dh" style="padding:0 0 12px"><span>Saved addresses</span><button data-x="close" aria-label="Close">✕</button></div>`+
 (S.addrs.map(a=>`<div class="ac ${a.id===S.sel?'sel':''}"><input type="radio" name="ad" ${a.id===S.sel?'checked':''} data-sel="${a.id}" aria-label="Select address">
  <div style="flex:1"><b>${esc(a.name)}</b><span class="tag">${esc(a.type)}</span><br>${esc(a.line)}, ${esc(a.city)} – ${esc(a.pin)}<br><small>Mobile: ${esc(a.phone)}</small>
  <div class="acts" style="margin-top:6px"><button data-ed="${a.id}">Edit</button><button data-del="${a.id}">Remove</button></div></div></div>`).join('')||'<p style="color:var(--mute);padding:10px 0">No saved addresses yet. Add one below.</p>')+
 (showForm?`<h3 style="margin:14px 0 4px;font-size:15px">${editing?'Edit address':'Add new address'}</h3>
  <div class="af"><input id="an" placeholder="Full name" value="${esc(e.name)}"><input id="ap" placeholder="Mobile (10 digits)" inputmode="numeric" maxlength="10" value="${esc(e.phone)}">
  <input id="az" placeholder="Pincode (6 digits)" inputmode="numeric" maxlength="6" value="${esc(e.pin)}"><input id="ac" placeholder="City" value="${esc(e.city)}">
  <input class="w" id="al" placeholder="House no., building, street, area" value="${esc(e.line)}">
  <select id="at" class="w"><option ${e.type==='Home'?'selected':''}>Home</option><option ${e.type==='Work'?'selected':''}>Work</option><option ${e.type==='Other'?'selected':''}>Other</option></select></div>
  <button class="place" data-x="save">Save address</button>`
 :`<button class="place" data-x="new">+ Add new address</button>`)}
$('#mod').onclick=ev=>{const t=ev.target,d=t.dataset;
 if(d.x==='close'){closeAddr();return}
 if(d.sel){S.sel=+d.sel;render();drawAddr();toast('Delivery address updated')}
 if(d.del){S.addrs=S.addrs.filter(a=>a.id!==+d.del);if(S.sel===+d.del)S.sel=S.addrs[0]?S.addrs[0].id:0;render();drawAddr()}
 if(d.ed){editing=S.addrs.find(a=>a.id===+d.ed);showForm=true;drawAddr()}
 if(d.x==='new'){editing=null;showForm=true;drawAddr()}
 if(d.x==='save'){
  const a={name:$('#an').value.trim(),phone:$('#ap').value.trim(),pin:$('#az').value.trim(),city:$('#ac').value.trim(),line:$('#al').value.trim(),type:$('#at').value};
  if(!a.name||!a.line||!a.city)return toast('Fill in name, address and city');
  if(!/^\d{10}$/.test(a.phone))return toast('Enter a valid 10-digit mobile number');
  if(!/^\d{6}$/.test(a.pin))return toast('Enter a valid 6-digit pincode');
  if(editing)Object.assign(editing,a);else{a.id=Date.now();S.addrs.push(a);S.sel=a.id}
  showForm=false;editing=null;render();drawAddr();toast('Address saved')}};
$('#mveil').onclick=closeAddr;$('#prof').onclick=openAddr;

/* ---------- product page ---------- */
let curP=null,curSize=null,curImg=0,rStars=0;
function openPdp(id,keep){curP=P.find(p=>p.id===id);if(!keep){curSize=null;curImg=0;rStars=0}
 const p=curP,sz=sizesFor(p),rv=allRev(p),avg=(rv.reduce((a,r)=>a+r.st,0)/rv.length).toFixed(1);
 const dist=[5,4,3,2,1].map(s=>{const c=rv.filter(r=>r.st===s).length;return`<span>${s} ★</span><i><u style="width:${c/rv.length*100}%"></u></i><span>${c}</span>`}).join('');
 $('#pdp').innerHTML=`<div class="pbar"><button id="back">← Back</button><a class="logo" href="#" onclick="closePdp();return false">Drapely</a></div>
 <div class="pwrap"><div class="gal"><div class="thumbs">${[0,1,2,3].map(k=>`<img data-th="${k}" class="${k===curImg?'on':''}" src="${imgUrl(p,k,140,186)}" data-p="${p.id}" data-k="${k}" data-w="140" data-h="186" alt="View ${k+1}" onerror="fb(this)">`).join('')}</div>
  <div class="big" style="background:${grad(p)}">${im(p,curImg,800,1066,p.name)}</div></div>
 <div class="pi"><h1>${esc(p.brand)}</h1><div class="sub">${esc(p.name)}</div>
  <span class="rbadge">${avg} ★ <span>| ${p.cnt.toLocaleString('en-IN')} Ratings</span></span>
  <div class="pp">${inr(p.price)}<s>${inr(p.mrp)}</s><em>(${p.d}% OFF)</em></div><div class="tax">inclusive of all taxes</div>
  ${sz.length?`<h3 style="margin-top:18px;font-size:14px">SELECT SIZE</h3><div class="sizes">${sz.map(s=>`<button data-sz="${s}" class="${s===curSize?'on':''}">${s}</button>`).join('')}</div>`:'<div style="height:16px"></div>'}
  <div class="btns"><button class="pri" id="padd">🛍 Add to bag</button><button id="pwish">${S.wish.has(p.id)?'♥ Wishlisted':'♡ Wishlist'}</button></div>
  <div class="box"><h3>Delivery options</h3><div class="pin"><input id="pinq" placeholder="Enter pincode" inputmode="numeric" maxlength="6" value="${curAddr()?esc(curAddr().pin):''}"><button id="pchk">Check</button></div><div id="pres" style="margin-top:6px;color:var(--mute)">Enter a pincode to see the delivery date.</div></div>
  <div class="box"><h3>Best offers</h3>• 10% off up to ₹300 on your first order with code <b>WELCOME10</b><br>• Free delivery on orders above ₹999<br>• 14-day easy returns and exchange</div>
  <div class="box"><h3>Product details</h3>${esc(p.name)} from ${esc(p.brand)}. ${p.g==='Beauty'?'Dermatologically tested. Suitable for all skin types.':p.g==='Home'?'Durable, easy-care material that suits any room.':'Soft, breathable material with a comfortable regular fit.'}
   <br><br><b>Material &amp; care:</b> ${p.g==='Beauty'?'Store in a cool, dry place.':'Machine wash cold, do not bleach, dry in shade.'}<br><b>Sold by:</b> Drapely Retail Pvt. Ltd.</div>
  <div class="box"><h3>Ratings &amp; reviews</h3>
   <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div style="font-size:34px;font-weight:800">${avg} ★</div><div class="dist">${dist}</div></div>
   <div id="rlist">${rv.map(r=>`<div class="rev"><div class="h"><span class="star ${r.st<4?'lo':''}">${r.st} ★</span><b>${esc(r.t)}</b></div><div>${esc(r.b)}</div><div class="ver" style="margin-top:4px">${esc(r.n)} · ${esc(r.d)}${r.v?' · ✔ Verified buyer':''}</div></div>`).join('')}</div>
   <div class="rf"><h3>Write a review</h3><div class="sel" id="rsel">${[1,2,3,4,5].map(i=>`<button data-rs="${i}" class="${i<=rStars?'on':''}" aria-label="${i} star">★</button>`).join('')}</div>
   <input id="rt" placeholder="Title (optional)"><textarea id="rb" rows="3" placeholder="What did you like or dislike?"></textarea><button class="go" id="rsub">Submit review</button></div></div>
 </div></div>`;
 $('#pdp').classList.add('on');if(!keep)$('#pdp').scrollTop=0;document.body.style.overflow='hidden'}
function closePdp(){$('#pdp').classList.remove('on');document.body.style.overflow=''}
$('#pdp').onclick=e=>{const t=e.target,d=t.dataset,p=curP;
 if(t.id==='back')closePdp();
 if(d.th){curImg=+d.th;openPdp(p.id,true)}
 if(d.sz){curSize=d.sz;openPdp(p.id,true)}
 if(t.id==='padd'){if(sizesFor(p).length&&!curSize)return toast('Please select a size');addCart(p.id,curSize);toast('Added to bag')}
 if(t.id==='pwish')toggleWish(p.id);
 if(t.id==='pchk'){const v=$('#pinq').value.trim();if(!/^\d{6}$/.test(v))return $('#pres').textContent='Enter a valid 6-digit pincode.';
  const dt=new Date(Date.now()+(2+v.charCodeAt(5)%4)*864e5);$('#pres').innerHTML=`<span style="color:var(--ok)">✔ Delivery by <b>${dt.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}</b>. Pay on delivery available.</span>`}
 if(d.rs){rStars=+d.rs;document.querySelectorAll('#rsel button').forEach(b=>b.classList.toggle('on',+b.dataset.rs<=rStars))}
 if(t.id==='rsub'){const b=$('#rb').value.trim();if(!rStars)return toast('Tap the stars to rate');if(!b)return toast('Write a few words about the product');
  (userRev[p.id]=userRev[p.id]||[]).unshift({n:'You',st:rStars,t:$('#rt').value.trim()||'My review',b,d:'Today',v:false});rStars=0;openPdp(p.id,true);toast('Thanks for your review')}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeAddr();closePdp()}});

/* ---------- drawer (bag / wishlist) ---------- */
let mode='bag';
function openDrawer(m){mode=m;drawer();$('#drawer').classList.add('on');$('#veil').classList.add('on')}
function closeDrawer(){$('#drawer').classList.remove('on');$('#veil').classList.remove('on')}
function drawer(){
 if(mode==='wish'){$('#dtitle').textContent='Wishlist ('+S.wish.size+')';
  $('#lines').innerHTML=[...S.wish].map(i=>P.find(p=>p.id===i)).map(p=>`<div class="line">${im(p,0,120,160,'')}<div style="flex:1"><b>${esc(p.brand)}</b><div>${esc(p.name)}</div><div>${inr(p.price)}</div>
   <button data-view="${p.id}" style="color:var(--accent);font-weight:700;margin-top:6px">View product</button></div></div>`).join('')||'<div class="empty">Your wishlist is empty. Tap ♡ on a product to save it.</div>';
  $('#foot').innerHTML='';return}
 const it=Object.entries(S.cart).map(([k,c])=>({k,c,p:P.find(p=>p.id===c.id)}));
 $('#dtitle').textContent='Bag ('+it.reduce((a,x)=>a+x.c.q,0)+')';
 $('#lines').innerHTML=it.map(({k,c,p})=>`<div class="line">${im(p,0,120,160,'')}<div style="flex:1"><b>${esc(p.brand)}</b><div>${esc(p.name)}${c.size?' · Size '+esc(c.size):''}</div>
  <div>${inr(p.price)} <s style="color:var(--mute)">${inr(p.mrp)}</s></div><div class="qty"><button data-m="${esc(k)}">−</button><span>${c.q}</span><button data-p="${esc(k)}">+</button></div></div></div>`).join('')||'<div class="empty">Your bag is empty. Add something you like.</div>';
 const mrp=it.reduce((a,x)=>a+x.p.mrp*x.c.q,0),tot=it.reduce((a,x)=>a+x.p.price*x.c.q,0),ship=tot&&tot<999?79:0,a=curAddr();
 $('#foot').innerHTML=it.length?`<div class="dlv">${a?`Deliver to <b>${esc(a.name)}</b>, ${esc(a.line)}, ${esc(a.city)} – ${esc(a.pin)} <button data-x="chg" style="color:var(--accent);font-weight:700">Change</button>`:`No address selected. <button data-x="chg" style="color:var(--accent);font-weight:700">Add address</button>`}</div>
  <div class="row"><span>Total MRP</span><span>${inr(mrp)}</span></div><div class="row" style="color:var(--ok)"><span>Discount</span><span>−${inr(mrp-tot)}</span></div>
  <div class="row"><span>Delivery</span><span>${ship?inr(ship):'Free'}</span></div><div class="row tot"><span>Total</span><span>${inr(tot+ship)}</span></div>
  <button class="place" data-x="place">Place order</button>`:''}
$('#drawer').onclick=e=>{const t=e.target,d=t.dataset;
 if(t.id==='close'){closeDrawer();return}
 if(d.p)S.cart[d.p].q++;
 if(d.m){S.cart[d.m].q--;if(!S.cart[d.m].q)delete S.cart[d.m]}
 if(d.view){closeDrawer();openPdp(+d.view);return}
 if(d.x==='chg'){openAddr();return}
 if(d.x==='place'){if(!curAddr()){toast('Add a delivery address first');openAddr();return}
  const a=curAddr(),id='DR'+Math.floor(1e7+Math.random()*9e7);S.cart={};closeDrawer();render();toast(`Order ${id} placed. Delivering to ${a.city} – ${a.pin}`);return}
 render();drawer()};
$('#bag').onclick=()=>openDrawer('bag');$('#wl').onclick=()=>openDrawer('wish');
$('#close').onclick=closeDrawer;$('#veil').onclick=closeDrawer;
render();
</script>
</body>
</html>
